# Portal com login único: oauth2-proxy na frente da intranet.
# Faz o login no Keycloak e só então repassa a requisição ao backend (UPSTREAM).
# Uso: ./setup.sh <URL-do-portal> <URL-do-keycloak> <upstream>  &&  docker compose up -d
name: safenet-portal

services:
  proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    restart: unless-stopped
    ports:
      - "${PORTAL_PORT:-8082}:4180"
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_URL:?rode setup.sh}/realms/safenet
      OAUTH2_PROXY_CLIENT_ID: intranet
      OAUTH2_PROXY_CLIENT_SECRET: ${INTRANET_CLIENT_SECRET:?defina INTRANET_CLIENT_SECRET no .env}
      OAUTH2_PROXY_REDIRECT_URL: ${PORTAL_URL}/oauth2/callback
      OAUTH2_PROXY_UPSTREAMS: ${UPSTREAM}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_COOKIE_SECRET: ${COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      OAUTH2_PROXY_ALLOWED_GROUPS: GS_App_Intranet
      OAUTH2_PROXY_OIDC_GROUPS_CLAIM: groups
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_USER_HEADERS: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      OAUTH2_PROXY_INSECURE_OIDC_ALLOW_UNVERIFIED_EMAIL: "true"
      OAUTH2_PROXY_BACKEND_LOGOUT_URL: ${KEYCLOAK_URL}/realms/safenet/protocol/openid-connect/logout?id_token_hint={id_token}
      # Páginas abertas a quem não é da empresa (candidatos, autoavaliação). TEM que
      # bater com PUBLICO em gateway_auth.py do backend.
      OAUTH2_PROXY_SKIP_AUTH_REGEX: ^/(health$$|favicon|logo\.png$$|candidatura/|api/candidatura/|rh/vaga/|api/rh/desempenho/public/|rh/autoavaliacao\.html$$|rh/avaliacao_avaliador\.html$$|rh/avaliacao_supervisor\.html$$)
