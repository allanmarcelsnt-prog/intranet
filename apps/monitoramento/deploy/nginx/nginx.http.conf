# Gateway HTTP (padrão). Para HTTPS use NGINX_CONF=nginx.https.conf no .env.
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 25m;
server_tokens off;

# Acesso dos operadores (porta publicada). O painel administrativo do GoTrue fica bloqueado.
server {
    listen 80 default_server;
    server_name _;
    location ^~ /auth/v1/admin { return 403; }
    # Configuração do navegador (chave pública "anon"); gerada a partir do .env na inicialização do container.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__SAFENET__={"key":"${ANON_KEY}"};';
    }
    include /etc/nginx/safenet-common.inc;
}

# Acesso interno do app (porta 8080 NÃO publicada): libera /auth/v1/admin para remover operadores.
server {
    listen 8080;
    server_name _;
    include /etc/nginx/safenet-common.inc;
}
