# Gateway HTTPS. Requer deploy/certs/fullchain.pem e deploy/certs/privkey.pem.
# O navegador só libera "Escolher pasta" (File System Access API) em HTTPS com certificado CONFIÁVEL.
# (${HTTPS_PORT} e ${ANON_KEY} são substituídos na inicialização do container.)
resolver 127.0.0.11 valid=10s ipv6=off;
client_max_body_size 25m;
server_tokens off;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:5m;
    location ^~ /auth/v1/admin { return 403; }
    # Configuração do navegador (chave pública "anon"); gerada a partir do .env na inicialização do container.
    location = /config.js {
        default_type application/javascript;
        add_header Cache-Control "no-store";
        return 200 'window.__SAFENET__={"key":"${ANON_KEY}"};';
    }
    include /etc/nginx/safenet-common.inc;
}

server {
    listen 8080;
    server_name _;
    include /etc/nginx/safenet-common.inc;
}
